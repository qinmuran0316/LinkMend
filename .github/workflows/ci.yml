name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LinkMend.slnx

      - name: Build
        run: dotnet build LinkMend.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/LinkMend.Tests/LinkMend.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish self-contained package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/publish.ps1 -Configuration Release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: LinkMend-win-x64
          path: artifacts/release/*.zip
          if-no-files-found: error
