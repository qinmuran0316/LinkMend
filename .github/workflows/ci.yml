name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LinkMend.slnx

      - name: Build
        run: dotnet build LinkMend.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/LinkMend.Tests/LinkMend.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish self-contained package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/publish.ps1 -Configuration Release

      - name: Build Windows installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-installer.ps1 -SkipPublish

      - name: Test install, upgrade, and uninstall
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/test-installer.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: LinkMend-win-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/*-Setup.exe
            artifacts/release/*.sha256
          if-no-files-found: error

      - name: Upload installer validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LinkMend-installer-validation
          path: |
            artifacts/test-results/installer-smoke-*.json
            artifacts/installer-smoke/**/*.log
          if-no-files-found: ignore
